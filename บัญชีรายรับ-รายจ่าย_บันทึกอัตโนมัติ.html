<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>บัญชีรายรับ-รายจ่าย</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#2b2b2b;--mut:#8a8a8a;--line:#d9ccb0;--in:#1e8e3e;--out:#d93025;--bal:#0b7bc0;--acc:#ffb300;--hd:#ffd966;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#121212;--ink:#f2f2f2;--mut:#9a9a9a;--line:#3a3a3a;--in:#00e676;--out:#ff5252;--bal:#40c4ff;--hd:#997300}}
:root[data-theme="dark"]{--bg:#000;--card:#121212;--ink:#f2f2f2;--mut:#9a9a9a;--line:#3a3a3a;--in:#00e676;--out:#ff5252;--bal:#40c4ff;--hd:#997300}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:600 19px/1.5 Sarabun,"Noto Sans Thai Looped","Noto Sans Thai",sans-serif;padding-bottom:120px}
#app{max-width:1280px;margin:0 auto;padding:16px 20px}
h1{font-size:26px;margin:4px 0 10px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:8px 0}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:inherit;padding:10px 18px;border-radius:10px;white-space:nowrap}
.seg button.on{background:var(--acc);color:#000}
.mn{display:flex;align-items:center;gap:14px}.mn b{min-width:150px;text-align:center;font-size:21px}
.mn button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;width:46px;height:46px;border-radius:12px;font-size:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stats .v{font-size:26px}.mut{color:var(--mut);font-size:15px}
.in{color:var(--in)}.out{color:var(--out)}.bl{color:var(--bal)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{width:100%;border-collapse:collapse;min-width:680px}
th{background:var(--hd);color:#000;padding:12px 8px}
:root:not([data-theme="light"]) th{color:#fff}
td{padding:12px 10px;border-top:1px solid var(--line);border-right:1px solid var(--line)}td:last-child{border-right:0}
td.n{text-align:right;white-space:nowrap}td.c{text-align:center}
tr.r{cursor:pointer}tr.r:active{background:#8883}
.chip{display:inline-block;border-radius:999px;padding:3px 12px;font-size:16px;white-space:nowrap}
.bar{height:12px;border-radius:6px;margin-top:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-top:6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:12px;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:260px;border:0;background:none;color:var(--mut);font:inherit;padding:10px;border-radius:12px}nav button.on{background:var(--acc);color:#000}
.fab{position:fixed;right:22px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:66px;height:66px;border-radius:50%;border:0;background:var(--acc);color:#000;font-size:38px;box-shadow:0 4px 14px #0006}
.sheet{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:5;padding:14px}
.sheet>div{background:var(--bg);width:100%;max-width:680px;max-height:94%;overflow:auto;border-radius:22px;padding:18px}
input{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}.chips .chip{border:2px solid transparent;font-size:17px;padding:7px 14px}.chips .sel{border-color:var(--ink)}
.go{display:block;width:100%;text-align:center;border:0;border-radius:14px;background:var(--acc);color:#000;font:inherit;font-size:20px;padding:12px;margin-top:8px}
.go2{background:var(--card);color:var(--ink);border:1px solid var(--line)}.del{background:var(--out);color:#fff}
.pv{max-width:100%;max-height:60vh;border-radius:12px;display:block;margin:8px auto}
.who{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:16px;cursor:pointer;margin-bottom:6px}
.empty{text-align:center;color:var(--mut);padding:36px 0}
.who{margin-right:6px}
.cover{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#ffe3ec,#fff3c4);border-radius:22px;padding:10px 20px 10px 14px;margin-bottom:10px;box-shadow:0 3px 10px #0003}.cover h1{margin:0;color:#5a3a45}.cover .mut{color:#8a6070}
.pig{animation:bob 2.4s ease-in-out infinite;flex:none}
.kpad{position:fixed;left:0;right:0;bottom:0;z-index:8;max-width:520px;margin:0 auto;background:var(--bg);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:12px 16px calc(10px + env(safe-area-inset-bottom,0px));animation:rise .2s;box-shadow:0 -6px 18px #0005}
.kk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;justify-items:center;margin-bottom:8px}
.kk button{width:64px;height:64px;border-radius:50%;border:0;background:rgba(128,128,128,.28);color:var(--ink);font:inherit;font-size:27px}
input.act{outline:3px solid var(--acc)}
.sgb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-2px 0 8px}.sgc{background:var(--card);border:1px dashed var(--acc);color:var(--ink);cursor:pointer;font-size:16px}
body.kpo .sheet{align-items:flex-start;padding-bottom:390px}@keyframes bob{50%{transform:translateY(-5px)}}
select{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:4px 0 10px}
button,.chip,tr.r,.who{transition:transform .12s,filter .12s;-webkit-tap-highlight-color:transparent}
button:active,.chips span:active,tr.r:active,.who:active{transform:scale(.92);filter:brightness(1.25)}
.chips.has .chip{opacity:.4;transform:scale(.95)}
.chips .sel{opacity:1!important;transform:scale(1.08);border-color:var(--ink);box-shadow:0 0 0 3px var(--acc),0 5px 14px #0006;animation:pop .28s}
.chips .sel::before{content:"✓ ";font-weight:600}
.addc{border:2px dashed var(--mut)!important;color:var(--mut);background:none}
.seg button.on{box-shadow:0 2px 8px #0005;animation:pop .25s}
.sheet>div{animation:rise .22s ease-out}.fab{animation:pop .4s}.fab:active{transform:scale(.86) rotate(90deg)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--acc);color:#000;padding:10px 22px;border-radius:999px;z-index:9;animation:rise .25s;box-shadow:0 4px 14px #0006}
@keyframes pop{50%{transform:scale(1.15)}}@keyframes rise{from{opacity:0;transform:translateY(18px)}}
</style></head><body><div id="app"></div><div id="kpbox"></div>
<script>
const CATS=[["เงินจากผู้ปกครอง","#CDEFD3","#1E7B34","in"],["เงินเดือน/งานพิเศษ","#B7E4C7","#14532D","in"],["รายรับอื่นๆ","#D5F5E3","#1B5E20","in"],
["อาหารและเครื่องดื่ม","#CFE2FF","#1A5FB4","out"],["ที่พัก/ค่าเช่า","#FAD4D4","#C0392B","out"],["ค่าเดินทาง","#FFE8A3","#8A6100","out"],
["การเรียน/อุปกรณ์","#D9D2F2","#5B3CA8","out"],["ค่าน้ำ-ไฟ-โทรศัพท์-เน็ต","#D6E4EA","#3C5A68","out"],["ช้อปปิ้ง","#FFD1E3","#B0245F","out"],
["สุขภาพ","#2E7D5B","#FFFFFF","out"],["บันเทิง/สังสรรค์","#C62828","#FFFFFF","out"],["เงินออม","#8D6E3F","#FFFFFF","out"],["รายจ่ายอื่นๆ","#E0E0E0","#424242","out"],["หนี้สิน","#FFCDD2","#B71C1C","out"],["โอนระหว่างบัญชี","#B2EBF2","#006064","tr"]];
const ACCS=[["main","บัญชีหลัก"],["save","บัญชีเงินเก็บ"],["cash","💵 เงินสด"],["all","รวม"]];
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())};
const fm=n=>n.toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cat=n=>CATS.find(c=>c[0]===n)||["?","#E0E0E0","#424242"];
const chip=(n,x="")=>{const c=cat(n);return `<span class="chip ${x}" style="background:${c[1]};color:${c[2]}">${esc(n)}</span>`};
const sum=(l,t)=>l.filter(x=>x.type===t).reduce((s,x)=>s+x.amt,0);
const K="ledger-v1", AUTO="ledger-autosave-v1";
let S={tx:[],acc:"main",m:today().slice(0,7),view:"log",add:false,type:"out",cat:"",acc2:"main",det:null,img:null,slip:null,msg:"",f:{amt:"",it:"",dt:today()}};
try{
  S.tx=JSON.parse(localStorage.getItem(K)||"[]");
  const recovery=JSON.parse(localStorage.getItem(AUTO)||"null");
  if(recovery && Array.isArray(recovery.tx) && recovery.savedAt > (Number(localStorage.getItem("ledger-t"))||0)){
    S.tx=recovery.tx;
    localStorage.setItem(K,JSON.stringify(S.tx));
  }
}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S.tx));persistRecovery()}catch(e){}};
try{S.name=localStorage.getItem("ledger-name")||""}catch(e){S.name=""}
const AN={main:"บัญชีหลัก",save:"บัญชีเงินเก็บ",cash:"เงินสด"};
const CC=[];try{CC.push(...JSON.parse(localStorage.getItem("ledger-cats")||"[]"));CATS.push(...CC)}catch(e){}
let DEBTS=[];try{DEBTS=JSON.parse(localStorage.getItem("ledger-debts")||"[]")}catch(e){}
const saveD=()=>{try{localStorage.setItem("ledger-debts",JSON.stringify(DEBTS))}catch(e){}};
function persistRecovery(){
  try{
    const payload={tx:S.tx,debts:DEBTS,cats:CC,name:S.name||"",bud:S.bud||0,savedAt:Date.now()};
    localStorage.setItem(AUTO,JSON.stringify(payload));
  }catch(e){}
}
const PAL=[["#FFE0B2","#E65100"],["#F8BBD0","#880E4F"],["#C5CAE9","#1A237E"],["#B2DFDB","#004D40"],["#FFF9C4","#827717"],["#D7CCC8","#3E2723"],["#E1BEE7","#4A148C"],["#CFD8DC","#263238"]];
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}};
document.addEventListener("click",e=>{if(e.target.closest("button,.chip,tr.r,.who"))buzz()});
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1700)}
const setTo=a=>{rf();S.to=a;R()};
function openCat(){rf();S.nc={n:"",c:0};R()}
function saveCat(){const n=$("#cn").value.trim();if(!n)return;if(!CATS.some(c=>c[0]===n)){const p=PAL[S.nc.c],c=[n,p[0],p[1],S.type];CC.push(c);CATS.push(c);try{localStorage.setItem("ledger-cats",JSON.stringify(CC))}catch(e){}}S.cat=n;S.nc=null;toast("เพิ่มหมวดแล้ว ✓");R()}
function addDebt(){const n=$("#dn").value.trim(),t=num($("#dt2").value),dy=parseInt($("#dd").value);if(!n||!(t>0)){toast("ใส่ชื่อกับยอดหนี้ก่อนนะ");return}DEBTS.push({id:Date.now(),name:n,total:t,paid:0,day:dy>=1&&dy<=31?dy:0,end:$("#de").value||""});saveD();toast("เพิ่มหนี้แล้ว ✓");R()}
function payDebt(id){const d=DEBTS.find(x=>x.id===id),a=num($("#pm").value);if(!d||!(a>0))return;const amt=Math.min(a,d.total-d.paid);d.paid+=amt;S.tx.push({id:Date.now(),date:today(),acc:$("#pa").value,type:"out",cat:"หนี้สิน",item:"จ่ายหนี้ "+d.name,amt});save();saveD();S.pd=null;toast(d.paid>=d.total?"ปิดหนี้ "+d.name+" แล้ว 🎉":"จ่ายหนี้แล้ว ✓");R()}
function delDebt(id){DEBTS=DEBTS.filter(d=>d.id!==id);saveD();R()}
const pill=()=>{const r=DEBTS.filter(d=>d.paid<d.total).reduce((s,d)=>s+d.total-d.paid,0);return `<div class="who" onclick="go('dl',true)">💳 ${r?"หนี้ "+fm(r):"หนี้สิน"}</div><div class="who" onclick="go('bk',true)">💾 สำรองข้อมูล</div>`};
function dlg(){let h="";
 if(S.nc)h+=`<div class="sheet"><div><b>เพิ่มหมวดหมู่ใหม่ (${S.type==="in"?"รายรับ":"รายจ่าย"})</b><input id="cn" maxlength="20" placeholder="ชื่อหมวด เช่น กาแฟ" value="${esc(S.nc.n)}"><div class="chips has">${PAL.map((p,i)=>`<span class="chip${S.nc.c===i?" sel":""}" style="background:${p[0]};color:${p[1]}" onclick="S.nc.n=$('#cn').value;S.nc.c=${i};R()">ตัวอย่าง</span>`).join("")}</div><button class="go" onclick="saveCat()">เพิ่มหมวด</button><button class="go go2" onclick="S.nc=null;R()">ยกเลิก</button></div></div>`;
 if(S.dl){const act=DEBTS.filter(d=>d.paid<d.total);
  h+=`<div class="sheet"><div><b style="font-size:20px">💳 หนี้สิน</b>${act.map(d=>{const r=d.total-d.paid,late=d.end&&d.end<today();return `<div class="card" style="margin:10px 0"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(d.name)}</b><b class="out">${fm(r)}</b></div><div class="mut">จากทั้งหมด ${fm(d.total)}${d.day?` · จ่ายทุกวันที่ ${d.day}`:""}${d.end?` · ครบ ${dlabel(d.end)}${late?" ⚠ เลยกำหนด":""}`:""}</div><div class="bar" style="width:${Math.max(2,Math.round(d.paid/d.total*100))}%;background:var(--in)"></div>${S.pd===d.id?`<input id="pm" type="text" readonly inputmode="none" onclick="kpOpen('pm')" placeholder="จ่ายเท่าไหร่ (ค้าง ${fm(r)})"><select id="pa">${["main","save","cash"].map(a=>`<option value="${a}">จ่ายจาก${AN[a]}</option>`).join("")}</select><button class="go" onclick="payDebt(${d.id})">ยืนยันจ่าย</button>`:`<button class="go go2" onclick="S.pd=${d.id};R()">จ่ายหนี้</button>`}<div style="text-align:right"><span class="mut" onclick="delDebt(${d.id})">ลบหนี้นี้</span></div></div>`}).join("")||`<div class="empty">ตอนนี้ไม่มีหนี้ 🎉</div>`}<div class="card"><b>เพิ่มหนี้ใหม่</b><input id="dn" placeholder="ชื่อหนี้ (เช่น บัตรเครดิต)"><input id="dt2" type="text" readonly inputmode="none" onclick="kpOpen('dt2')" placeholder="ยอดหนี้ทั้งหมด"><input id="dd" type="number" min="1" max="31" placeholder="จ่ายทุกวันที่ (1-31) ไม่บังคับ"><div class="mut">จ่ายให้ครบภายใน (ไม่บังคับ)</div><input id="de" type="date"><button class="go" onclick="addDebt()">เพิ่มหนี้</button></div><button class="go go2" onclick="S.dl=false;S.pd=null;R()">ปิด</button></div></div>`}
 return h}
function openEdit(id){const t=S.tx.find(x=>x.id===id);if(!t)return;const m=t.tid?S.tx.find(x=>x.tid===t.tid&&x.type==="out"):t;S.ed=m.id;S.det=null;S.add=true;S.slip=null;S.msg="";
 if(m.tid){S.type="tr";S.acc2=m.acc;S.to=S.tx.find(x=>x.tid===m.tid&&x.type==="in").acc;S.cat=""}else{S.type=m.type;S.cat=m.cat;S.acc2=m.acc}
 S.f={amt:m.amt.toLocaleString("en-US",{maximumFractionDigits:2}),it:m.item||"",dt:m.date};R()}
const num=s=>parseFloat(String(s).replace(/,/g,""));
function cm(el){let v=el.value.replace(/[^\d.]/g,"");const i=v.indexOf(".");if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,"").slice(0,2);const p=v.split(".");el.value=(p[0]?p[0].replace(/\B(?=(\d{3})+(?!\d))/g,","):"")+(p.length>1?"."+p[1]:"")}
const PIG=`<svg class="pig" viewBox="0 0 64 64" width="70" height="70"><ellipse cx="32" cy="38" rx="22" ry="17" fill="#FFB6C9"/><circle cx="16" cy="23" r="6" fill="#FF93AF"/><circle cx="46" cy="23" r="6" fill="#FF93AF"/><ellipse cx="53" cy="38" rx="7" ry="6" fill="#FF93AF"/><circle cx="51" cy="37" r="1.4" fill="#B03060"/><circle cx="55" cy="37" r="1.4" fill="#B03060"/><circle cx="42" cy="32" r="2.3" fill="#3b2a2a"/><circle cx="38" cy="41" r="3" fill="#FF8FA8" opacity=".6"/><rect x="26" y="20" width="12" height="3" rx="1.5" fill="#B03060"/><rect x="18" y="52" width="6" height="8" rx="3" fill="#FF93AF"/><rect x="40" y="52" width="6" height="8" rx="3" fill="#FF93AF"/><circle cx="32" cy="9" r="7" fill="#FFD54F" stroke="#F9A825" stroke-width="2"/><text x="32" y="13" font-size="10" text-anchor="middle" fill="#B7791F">฿</text></svg>`;
const KP=`<div class="kpad"><div class="kk">${["7","8","9","4","5","6","1","2","3","⌫","0","."].map(k=>`<button onclick="kp('${k}')">${k}</button>`).join("")}</div><button class="go" onclick="S.kp=null;kpSync()">เสร็จ</button></div>`;
function kp(k){const el=S.kp&&$("#"+S.kp);if(!el)return;let v=el.value.replace(/,/g,"");
 if(k==="⌫")v=v.slice(0,-1);else if(k==="."){if(v.includes("."))return;v=(v||"0")+"."}else{if(/\.\d{2}$/.test(v)||v.length>=12)return;v=(v==="0"?"":v)+k}
 el.value=v;cm(el)}
function kpSync(){const el=S.kp&&$("#"+S.kp);if(!el)S.kp=null;else el.classList.add("act");$("#kpbox").innerHTML=S.kp?KP:"";document.body.classList.toggle("kpo",!!S.kp);cloudSync()}
function kpOpen(id){S.kp=id;kpSync();const el=$("#"+id);if(el)el.scrollIntoView({block:"center",behavior:"smooth"})}
document.addEventListener("focusin",e=>{if(S.kp&&e.target.id!==S.kp&&e.target.matches&&e.target.matches("input,select")){S.kp=null;kpSync()}});
const srch=v=>{v=v.toLowerCase();document.querySelectorAll("tr.r").forEach(r=>r.style.display=r.dataset.s.includes(v)?"":"none")};
try{S.bud=Number(localStorage.getItem("ledger-bud"))||0}catch(e){S.bud=0}
const budCard=mo=>{const b=S.bud||0;if(!b)return `<div class="card" onclick="go('bd',true)" style="cursor:pointer"><div class="mut">งบรายเดือน</div><div class="v mut">+ ตั้งงบ</div></div>`;const p=Math.min(100,Math.round(mo/b*100)),o=mo>b;return `<div class="card" onclick="go('bd',true)" style="cursor:pointer"><div class="mut">งบเดือนนี้ ${fm(b)}</div><div class="v ${o?"out":"in"}">${o?"เกิน "+fm(mo-b):"เหลือ "+fm(b-mo)}</div><div class="bar" style="width:${Math.max(3,p)}%;background:var(${o?"--out":"--in"})"></div></div>`};
function saveBud(on){S.bud=on?(num($("#bdg").value)||0):0;try{localStorage.setItem("ledger-bud",String(S.bud))}catch(e){}S.bd=false;toast(on?"ตั้งงบแล้ว ✓":"เอางบออกแล้ว");R()}
async function backup(){let d=null;try{d=await claude.use("downloads")}catch(e){}if(!d){toast("เครื่องนี้บันทึกไฟล์ไม่ได้");return}
 try{await d.save({filename:"ledger-backup-"+today()+".json",data:JSON.stringify({v:1,tx:S.tx,debts:DEBTS,cats:CC,name:S.name,budget:S.bud})});toast("บันทึกไฟล์แล้ว ✓")}catch(e){if(!e||e.code!=="declined")toast("บันทึกไฟล์ไม่สำเร็จ")}}
